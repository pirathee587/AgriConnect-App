# Production profile overrides

# Production should not auto-create default credentials
app.bootstrap.default-admin.enabled=${BOOTSTRAP_DEFAULT_ADMIN:false}

# Production CORS must be explicitly set
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

# Production persistence safety
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# Production diagnostics hardening
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
spring.mail.debug=false

# Trust reverse proxy headers (recommended behind load balancer)
server.forward-headers-strategy=framework

# Keep production logs lean by default
logging.level.com.agriconnect=${LOG_LEVEL_AGRICONNECT:INFO}
