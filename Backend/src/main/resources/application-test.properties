    spring.application.name=agriconnect
    # ======================================================
    # AGRICONNECT - MAIN APPLICATION PROPERTIES
    # ======================================================

    # SERVER
    server.port=8080
    server.servlet.context-path=/

    # DATABASE (PostgreSQL)
    spring.datasource.url=jdbc:postgresql://localhost:5432/agriconnect
    spring.datasource.username=postgres
    spring.datasource.password=1506
    spring.datasource.driver-class-name=org.postgresql.Driver

    # Connection pool (HikariCP)
    spring.datasource.hikari.maximum-pool-size=10
    spring.datasource.hikari.minimum-idle=2
    spring.datasource.hikari.connection-timeout=30000
    spring.datasource.hikari.idle-timeout=600000
    spring.datasource.hikari.max-lifetime=1800000

    # JPA / HIBERNATE
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=false
    spring.jpa.properties.hibernate.format_sql=true
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
    spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo
    spring.jpa.open-in-view=false

    # JWT
    JWT_SECRET=agriconnect_super_secret_key_2024_very_long_string_minimum_256_bits
    jwt.expiration=86400000

    # OTP
    otp.expiry.minutes=5
    otp.max.attempts=3
    otp.hourly.limit=3

    # TWILIO SMS
    twilio.account.sid=YOUR_TWILIO_ACCOUNT_SID
    twilio.auth.token=YOUR_TWILIO_AUTH_TOKEN
    twilio.phone.number=+YOUR_TWILIO_PHONE_NUMBER

    # PAYHERE PAYMENT
    payhere.merchant.id=YOUR_PAYHERE_MERCHANT_ID
    payhere.merchant.secret=YOUR_PAYHERE_MERCHANT_SECRET
    payhere.api.url=https://www.payhere.lk/pay/checkout

    # FILE UPLOAD
    file.upload.dir=uploads
    spring.servlet.multipart.enabled=true
    spring.servlet.multipart.max-file-size=5MB
    spring.servlet.multipart.max-request-size=10MB

    # ACTUATOR
    management.endpoints.web.exposure.include=health,info
    management.endpoint.health.show-details=when-authorized

    # LOGGING
    logging.level.root=INFO
    logging.level.com.agriconnect=DEBUG
    logging.level.org.springframework.security=INFO
    logging.level.org.hibernate.SQL=INFO
    logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=ERROR
    logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

    # JACKSON (JSON)
    spring.jackson.serialization.write-dates-as-timestamps=false
    spring.jackson.time-zone=Asia/Colombo
    spring.jackson.default-property-inclusion=non_null

    # EMAIL (Gmail)
    spring.mail.host=smtp.gmail.com
    spring.mail.port=587
    spring.mail.username=jeyakumaranpiratheepan120@gmail.com
    spring.mail.password=ygdpilxanmgsrwsk
    spring.mail.properties.mail.smtp.auth=true
    spring.mail.properties.mail.smtp.starttls.enable=true
    spring.mail.debug=true